# pi-ai route and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
        reasoning: low
        modelOverrides:
          deepseek-flash:
            maxTokens: 1024
        # pi-ai's watchdog counts stream events, not keep-alive comments, and the stand-in holds the reply until
        # the title request arrives: a busy runner needs more than a second to send it.
        streamIdleTimeoutMs: 10000

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek
        model: deepseek-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
