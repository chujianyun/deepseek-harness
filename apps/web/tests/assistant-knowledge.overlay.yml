# For the assistant knowledge e2e (`assistant-knowledge.e2e.ts`), beside the Hub sign-in, knowledge,
# and knowledge chat rows: the Desktop assistant rows. The spec writes the assistants row's `dshHome`
# into the home profile patch.
- id: assistants
  disabled: false
  # These flows start from the single Daily Assistant; seeding the E-commerce Manager is covered by the package spec.
  config:
    seedTemplates: [daily]
- id: ui-assistants
  disabled: false
