# For the assistants e2e (`assistants.e2e.ts`), beside the Hub sign-in rows (`hub-account.overlay.yml`):
# the Desktop assistant rows and a scripted OpenAI-compatible chat model whose credential the spec stores.
# The spec writes the assistants row's `dshHome` into the home profile patch.
- id: assistants
  disabled: false
- id: ui-assistants
  disabled: false
- id: llm-pi-ai
  config:
    providers:
      acme-gateway:
        displayName: Acme 网关
        api: openai-completions
        baseURL: !!js process.env.DSH_E2E_CHAT_API
        apiKeyEnv: DSH_E2E_ACME_KEY
        models:
          - id: acme-chat
