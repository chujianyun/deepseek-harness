# Enables the Desktop knowledge rows for the keyless Web e2e (`knowledge.e2e.ts`) beside the Hub
# sign-in rows (`hub-account.overlay.yml`): knowledge bases, the embedding models they use, and
# an OpenAI-compatible provider route at the spec's mock embeddings endpoint. The spec writes the
# embedding row's settings into the home profile patch, where Settings can also write.
- id: embedding
  disabled: false
- id: ui-settings-embedding
  disabled: false
- id: knowledge-base
  disabled: false
- id: ui-knowledge
  disabled: false
- id: llm-pi-ai
  config:
    providers:
      acme-gateway:
        displayName: Acme 网关
        api: openai-completions
        baseURL: !!js process.env.DSH_E2E_EMBEDDING_API
        models:
          - id: acme-chat
