# Enables the MO WorkAI brand theme for the keyless Web e2e (`brand-mo.e2e.ts`). The shipped web-app
# bundle enables it only for the `desktop` profile with a configured user center.
- id: ui-brand-mo
  disabled: false
  config:
    quickTasks: [multi-publish, business-report, product-research, asset-organize]
    # The tasks need 电商管家's Skills: a card also picks the assistant created from the `ecommerce` template.
    quickTaskAssistant: ecommerce
    # As shipped: the Session list starts grouped by assistant.
    defaultSessionGrouping: assistant
